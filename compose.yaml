services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-strata}
      MYSQL_USER: ${MYSQL_USER:-strata}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-strata}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-strata_root}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - strata_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-strata}
      DB_USER: ${MYSQL_USER:-strata}
      DB_PASSWORD: ${MYSQL_PASSWORD:-strata}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  strata_mysql_data:
